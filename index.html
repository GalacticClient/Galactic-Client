<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galactic Launcher</title>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;700;900&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#0a0c14;font-family:'Nunito',sans-serif;color:#fff;min-height:100vh;}

nav{display:flex;align-items:center;padding:0 24px;height:60px;background:rgba(10,12,20,0.95);border-bottom:1px solid #1e2235;backdrop-filter:blur(8px);position:sticky;top:0;z-index:100;}
.nav-logo{display:flex;align-items:center;gap:10px;margin-right:auto;cursor:pointer;}
.nav-logo-text{font-size:22px;font-weight:800;background:linear-gradient(90deg,#4dd0ff,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.nav-links{display:flex;gap:4px;}
.nav-link{padding:8px 20px;border-radius:8px;font-size:15px;font-weight:600;color:#888;cursor:pointer;border:none;background:transparent;transition:all .15s;}
.nav-link:hover{color:#fff;}
.nav-link.active{background:#1a1d2e;color:#fff;}
.nav-close{width:36px;height:36px;border-radius:8px;background:#1a1d2e;border:none;color:#666;font-size:16px;cursor:pointer;margin-left:16px;display:flex;align-items:center;justify-content:center;transition:color .15s;}
.nav-close:hover{color:#fff;}

.page{display:none;}
.page.active{display:block;}

/* HERO */
.hero{width:100%;height:380px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;}
.hero-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;}
.hero-overlay{position:absolute;inset:0;background:linear-gradient(to bottom, rgba(10,12,20,0.25) 0%, rgba(10,12,20,0.55) 60%, rgba(10,12,20,1) 100%);}

.hero-content{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:14px;}
.launch-wrapper{display:flex;align-items:center;gap:0;}
.version-arrow{width:44px;height:60px;background:rgba(15,18,32,0.7);border:1px solid rgba(255,255,255,0.12);backdrop-filter:blur(10px);color:#aaa;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;user-select:none;}
.version-arrow:hover{background:rgba(77,208,255,0.15);color:#4dd0ff;border-color:rgba(77,208,255,0.4);}
.version-arrow.left{border-radius:12px 0 0 12px;border-right:none;}
.version-arrow.right{border-radius:0 12px 12px 0;border-left:none;}
.hero-launch-btn{background:rgba(10,14,28,0.7);border:1px solid rgba(255,255,255,0.18);backdrop-filter:blur(14px);padding:16px 48px;text-align:center;cursor:pointer;transition:all .2s;min-width:280px;}
.hero-launch-btn:hover{background:rgba(77,208,255,0.12);border-color:rgba(77,208,255,0.5);}
.hero-launch-btn:hover .launch-title{text-shadow:0 0 20px rgba(77,208,255,0.6);}
.launch-title{font-family:'Exo 2',sans-serif;font-size:20px;font-weight:900;letter-spacing:3px;color:#fff;}
.launch-version-row{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:5px;}
.launch-version-badge{background:rgba(77,208,255,0.18);border:1px solid rgba(77,208,255,0.4);border-radius:4px;padding:2px 10px;font-size:13px;font-weight:700;color:#4dd0ff;letter-spacing:1px;}
.launch-version-label{font-size:12px;color:#888;font-weight:600;}
.launch-version-tag{font-size:11px;color:#4dd0ff;font-weight:700;background:rgba(77,208,255,0.1);border-radius:3px;padding:1px 6px;letter-spacing:.5px;}
.version-dots{display:flex;gap:6px;align-items:center;}
.vdot{width:8px;height:8px;border-radius:50%;background:#2a2d42;border:1px solid #3a3d55;cursor:pointer;transition:all .2s;}
.vdot.active{background:#4dd0ff;border-color:#4dd0ff;box-shadow:0 0 8px rgba(77,208,255,0.6);}

/* NEWS */
.news-section{background:#0a0c14;padding:40px 40px 60px;}
.news-title{font-family:'Exo 2',sans-serif;font-size:22px;font-weight:900;letter-spacing:3px;text-align:center;margin-bottom:28px;color:#e0e8ff;}
.news-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
.news-card{background:#0f1120;border:1px solid #1a1d2e;border-radius:10px;overflow:hidden;cursor:pointer;transition:transform .15s,border-color .15s,box-shadow .15s;}
.news-card:hover{transform:translateY(-3px);border-color:#2a3a5a;box-shadow:0 8px 30px rgba(77,208,255,0.1);}
.news-card-thumb{width:100%;height:180px;display:block;object-fit:cover;}
.news-card-banner{width:100%;height:180px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;position:relative;overflow:hidden;background:#0b0f1e;}
.ncb-bg{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 120%,rgba(77,208,255,0.13) 0%,transparent 70%),linear-gradient(180deg,#080c1a 0%,#0d1428 100%);}
.ncb-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(77,208,255,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(77,208,255,0.04) 1px,transparent 1px);background-size:28px 28px;}
.ncb-avatar{width:56px;height:56px;border-radius:12px;border:2px solid rgba(77,208,255,0.35);position:relative;z-index:2;box-shadow:0 0 18px rgba(77,208,255,0.2);}
.ncb-info{position:relative;z-index:2;text-align:center;}
.ncb-user{font-size:12px;color:#4dd0ff;font-weight:700;letter-spacing:1px;opacity:.8;}
.ncb-repo{font-size:15px;color:#e8f0ff;font-weight:800;letter-spacing:.5px;}
.ncb-tag{display:inline-block;margin-top:6px;background:rgba(77,208,255,0.12);border:1px solid rgba(77,208,255,0.3);border-radius:4px;padding:2px 10px;font-size:11px;font-weight:700;color:#4dd0ff;letter-spacing:1px;font-family:'Exo 2',sans-serif;}
.news-card-body{padding:12px 14px 14px;}
.news-card-title{font-size:14px;font-weight:700;color:#d8e0ff;line-height:1.4;margin-bottom:10px;}
.news-card-meta{display:flex;justify-content:space-between;font-size:12px;color:#444;}
.news-card-link{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:#4dd0ff;font-weight:600;margin-top:8px;opacity:0.8;}
.news-card:hover .news-card-link{opacity:1;}

/* RELEASE MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(5,7,18,0.88);z-index:999;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .2s;}
.modal-overlay.open{opacity:1;pointer-events:all;}
.modal{background:#0d1020;border:1px solid #1e2438;border-radius:14px;width:680px;max-width:95vw;max-height:85vh;overflow:hidden;display:flex;flex-direction:column;transform:translateY(20px) scale(0.97);transition:transform .25s;}
.modal-overlay.open .modal{transform:translateY(0) scale(1);}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:18px 24px;border-bottom:1px solid #1a1d2e;flex-shrink:0;}
.modal-version-tag{font-family:'Exo 2',sans-serif;font-size:18px;font-weight:900;color:#4dd0ff;letter-spacing:2px;}
.modal-close{width:34px;height:34px;border-radius:8px;background:#1a1d2e;border:none;color:#888;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.modal-close:hover{background:#2a2d42;color:#fff;}
.modal-body{padding:24px;overflow-y:auto;flex:1;}
.modal-og-img{width:100%;border-radius:8px;margin-bottom:20px;display:block;}
.modal-notes-title{font-size:12px;font-weight:700;color:#555;letter-spacing:2px;text-transform:uppercase;margin-bottom:12px;}
.modal-notes{list-style:none;display:flex;flex-direction:column;gap:8px;}
.modal-notes li{display:flex;align-items:flex-start;gap:10px;font-size:14px;color:#c8d4f0;line-height:1.5;}
.modal-notes li::before{content:'▸';color:#4dd0ff;font-size:12px;margin-top:2px;flex-shrink:0;}
.modal-footer{padding:16px 24px;border-top:1px solid #1a1d2e;display:flex;justify-content:flex-end;gap:10px;flex-shrink:0;}
.modal-btn{padding:9px 22px;border-radius:7px;font-size:14px;font-weight:700;cursor:pointer;border:none;transition:opacity .15s;}
.modal-btn.primary{background:linear-gradient(135deg,#29b6d4,#1a7eb8);color:#fff;}
.modal-btn.secondary{background:#1a1d2e;color:#888;}
.modal-btn:hover{opacity:.85;}

/* DOWNLOADS */
.downloads-page{padding:40px;}
.downloads-title{font-family:'Exo 2',sans-serif;font-size:26px;font-weight:900;letter-spacing:3px;text-align:center;margin-bottom:32px;color:#e0e8ff;}
.downloads-list{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;border-radius:10px;overflow:hidden;border:1px solid #1a1d2e;}
.dl-row{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;background:#0f1120;border-bottom:1px solid #1a1d2e;}
.dl-row:last-child{border-bottom:none;}
.dl-name{font-size:16px;font-weight:700;color:#d8e0ff;}
.dl-desc{font-size:12px;color:#555;margin-top:2px;}
.dl-btn{background:linear-gradient(135deg,#29b6d4,#1a90c8);color:#fff;border:none;border-radius:6px;padding:8px 22px;font-size:14px;font-weight:700;cursor:pointer;transition:opacity .15s;}
.dl-btn:hover{opacity:.85;}

footer{padding:14px 40px;display:flex;justify-content:space-between;font-size:12px;color:#333;background:#0a0c14;border-top:1px solid #131625;}
</style>
</head>
<body>

<nav>
  <div class="nav-logo" onclick="showPage('home', document.querySelector('.nav-link'))">
    <svg width="36" height="36" viewBox="0 0 36 36" fill="none">
      <polygon points="18,2 34,11 34,25 18,34 2,25 2,11" fill="#0d1428" stroke="#4dd0ff" stroke-width="2"/>
      <path d="M10 22 L14 14 L18 20 L22 12 L26 22" stroke="#4dd0ff" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
    </svg>
    <span class="nav-logo-text">Galactic</span>
  </div>
  <div class="nav-links">
    <button class="nav-link active" onclick="showPage('home',this)">Home</button>
    <button class="nav-link" onclick="showPage('downloads',this)">Downloads</button>
  </div>
  <button class="nav-close">✕</button>
</nav>

// ============================================================
//  VERSION SWITCHER
// ============================================================
const LATEST_INDEX = VERSIONS.length - 1;
let currentVersionIndex = LATEST_INDEX;

function updateLaunchButton() {
  const v = VERSIONS[currentVersionIndex];
  const isLatest = currentVersionIndex === LATEST_INDEX;
  document.getElementById('versionBadge').textContent = v.label;
  document.getElementById('versionLabel').textContent = v.name;
  document.getElementById('versionTag').textContent = isLatest ? 'LATEST' : 'LEGACY';
  document.getElementById('versionTag').style.background = isLatest ? 'rgba(77,208,255,0.1)' : 'rgba(255,180,50,0.1)';
  document.getElementById('versionTag').style.color = isLatest ? '#4dd0ff' : '#ffb432';
  document.getElementById('versionBadge').style.borderColor = isLatest ? 'rgba(77,208,255,0.4)' : 'rgba(255,180,50,0.4)';
  document.getElementById('versionBadge').style.color = isLatest ? '#4dd0ff' : '#ffb432';
  document.getElementById('versionBadge').style.background = isLatest ? 'rgba(77,208,255,0.18)' : 'rgba(255,180,50,0.15)';
  document.querySelectorAll('.vdot').forEach((d, i) => d.classList.toggle('active', i === currentVersionIndex));
}

function changeVersion(dir) {
  currentVersionIndex = (currentVersionIndex + dir + VERSIONS.length) % VERSIONS.length;
  updateLaunchButton();
}

function launchClient() {
  const v = VERSIONS[currentVersionIndex];
  const txt = document.getElementById('launchText');
  const btn = document.getElementById('launchBtn');
  txt.textContent = 'LAUNCHING...';
  btn.style.pointerEvents = 'none';
  setTimeout(() => { window.location.href = v.file; }, 600);
}

function buildVersionDots() {
  const container = document.getElementById('versionDots');
  container.innerHTML = '';
  VERSIONS.forEach((v, i) => {
    const d = document.createElement('div');
    d.className = 'vdot' + (i === currentVersionIndex ? ' active' : '');
    d.title = v.label;
    d.onclick = () => { currentVersionIndex = i; updateLaunchButton(); };
    container.appendChild(d);
  });
}

// ============================================================
//  MODAL
// ============================================================
function openRelease(item) {
  document.getElementById('modalTitle').textContent = 'Release ' + item.version;
  const notes = document.getElementById('modalNotes');
  notes.innerHTML = item.notes.map(n => `<li>${n}</li>`).join('');
  document.getElementById('modalGhBtn').onclick = () => window.open(item.ghUrl, '_blank');
  document.getElementById('modalOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal(e) {
  if (e.target === document.getElementById('modalOverlay')) closeModalDirect();
}
function closeModalDirect() {
  document.getElementById('modalOverlay').classList.remove('open');
  document.body.style.overflow = '';
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModalDirect(); });

function buildNews() {
  const grid = document.getElementById('newsGrid');
  grid.innerHTML = '';
  NEWS_ITEMS.forEach((item, i) => {
    const card = document.createElement('div');
    card.className = 'news-card';
    card.onclick = () => openRelease(item);
    card.innerHTML = `
      <div class="news-card-banner">
        <div class="ncb-bg"></div>
        <div class="ncb-grid"></div>
        <img class="ncb-avatar" src="https://avatars.githubusercontent.com/GalacticClient?v=4" alt="GalacticClient" onerror="this.src='https://github.com/identicons/GalacticClient.png'">
        <div class="ncb-info">
          <div class="ncb-user">GalacticClient</div>
          <div class="ncb-repo">Galactic-Client</div>
          <div class="ncb-tag">RELEASE ${item.version}</div>
        </div>
      </div>
      <div class="news-card-body">
        <div class="news-card-title">${item.notes[0]}</div>
        <div class="news-card-meta"><span>Posted by ${item.author}</span><span>${item.date}</span></div>
        <div class="news-card-link">&#128279; View Release ${item.version}</div>
      </div>`;
    grid.appendChild(card);
  });
}

function buildDownloads() {
  const list = document.getElementById('downloadsList');
  list.innerHTML = '';
  DOWNLOAD_ITEMS.forEach(item => {
    const row = document.createElement('div');
    row.className = 'dl-row';
    row.innerHTML = `
      <div>
        <div class="dl-name">${item.name}</div>
        <div class="dl-desc">${item.desc}</div>
      </div>
      <button class="dl-btn" onclick="window.open('${item.url}','_blank')">Download</button>`;
    list.appendChild(row);
  });
}

function showPage(name, btn) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-link').forEach(b => b.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  if (btn) btn.classList.add('active');
}

function drawNewsCard(id, theme) {
  const c = document.getElementById(id);
  if (!c) return;
  c.width = 400; c.height = 180;
  const ctx = c.getContext('2d');
  if (theme === 'green') {
    const sky=ctx.createLinearGradient(0,0,0,180);sky.addColorStop(0,'#4a90d9');sky.addColorStop(1,'#7ab8f0');
    ctx.fillStyle=sky;ctx.fillRect(0,0,400,180);
    ctx.fillStyle='#ffe066';ctx.beginPath();ctx.arc(340,40,22,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.85)';
    [[60,30,20],[120,22,15],[220,35,18],[300,28,14]].forEach(([x,y,r])=>{ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(x+r*.8,y+3,r*.7,0,Math.PI*2);ctx.fill();});
    ctx.fillStyle='#3a7d30';ctx.beginPath();ctx.ellipse(80,160,100,60,0,Math.PI,0);ctx.fill();
    ctx.beginPath();ctx.ellipse(320,165,110,55,0,Math.PI,0);ctx.fill();
    ctx.fillStyle='#2d6e24';ctx.fillRect(0,140,400,40);
    ctx.fillStyle='#5a9e40';ctx.fillRect(0,138,400,8);
    function tree(x){ctx.fillStyle='#5a3a1a';ctx.fillRect(x-4,115,8,30);ctx.fillStyle='#2d8a20';ctx.fillRect(x-14,90,28,30);ctx.fillStyle='#35a025';ctx.fillRect(x-10,82,20,16);}
    [50,110,170,230,290,350].forEach(tree);
  } else if (theme === 'sunset') {
    const sky=ctx.createLinearGradient(0,0,0,180);sky.addColorStop(0,'#0a0520');sky.addColorStop(0.4,'#1a1040');sky.addColorStop(0.7,'#6a2010');sky.addColorStop(1,'#c05020');
    ctx.fillStyle=sky;ctx.fillRect(0,0,400,180);
    ctx.fillStyle='rgba(255,255,200,0.8)';
    [[30,20],[80,10],[140,25],[200,8],[260,18],[320,12],[370,25]].forEach(([x,y])=>{ctx.beginPath();ctx.arc(x,y,1,0,Math.PI*2);ctx.fill();});
    const glow=ctx.createRadialGradient(200,130,0,200,130,80);glow.addColorStop(0,'rgba(255,160,30,0.9)');glow.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=glow;ctx.fillRect(0,60,400,120);
    ctx.fillStyle='#ff9020';ctx.beginPath();ctx.arc(200,135,18,Math.PI,0);ctx.fill();
    ctx.fillStyle='#0d0820';ctx.beginPath();ctx.moveTo(0,180);
    [[0,140],[40,100],[80,130],[120,80],[160,110],[200,60],[240,100],[280,75],[320,105],[360,85],[400,120],[400,180]].forEach(([x,y])=>ctx.lineTo(x,y));
    ctx.closePath();ctx.fill();
    ctx.fillStyle='#080510';ctx.fillRect(0,155,400,25);
  } else {
    const sky=ctx.createLinearGradient(0,0,0,180);sky.addColorStop(0,'#050d20');sky.addColorStop(0.5,'#0a1a35');sky.addColorStop(1,'#152a4a');
    ctx.fillStyle=sky;ctx.fillRect(0,0,400,180);
    const mg=ctx.createRadialGradient(320,45,0,320,45,50);mg.addColorStop(0,'rgba(220,230,255,0.25)');mg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=mg;ctx.fillRect(260,0,120,100);
    ctx.fillStyle='#dde8ff';ctx.beginPath();ctx.arc(320,45,20,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#c8d8f0';ctx.beginPath();ctx.arc(313,40,18,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(200,220,255,0.7)';
    [[20,15],[60,8],[100,20],[160,10],[230,18],[280,8],[370,20]].forEach(([x,y])=>{ctx.beginPath();ctx.arc(x,y,1,0,Math.PI*2);ctx.fill();});
    ctx.fillStyle='#1a304a';ctx.beginPath();ctx.moveTo(0,180);
    [[0,130],[50,85],[100,120],[150,70],[200,105],[250,65],[300,90],[350,70],[400,100],[400,180]].forEach(([x,y])=>ctx.lineTo(x,y));
    ctx.closePath();ctx.fill();
    ctx.fillStyle='rgba(220,235,255,0.7)';
    [[50,85,20],[150,70,22],[250,65,24],[350,70,20]].forEach(([x,y,s])=>{ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-s,y+s*.8);ctx.lineTo(x+s,y+s*.8);ctx.closePath();ctx.fill();});
    ctx.fillStyle='#0d1e30';ctx.fillRect(0,155,400,25);
  }
}

function init() {
  buildVersionDots();
  updateLaunchButton();
  buildNews();
  buildDownloads();
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
</body>
</html>
